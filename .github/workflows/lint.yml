name: lint

# Runs the repo-level linters/formatters on every push and pull request.
#   - shellcheck    on bash scripts (install-deps.sh, setup.sh, vm-setup/**/*.sh)
#   - shfmt --diff  on bash scripts (same scope; -i 4 -ci)
#   - ruff check    on Python helpers (vm-setup/*.py, vm-setup/lib/*.py)
#   - ruff format --check on Python helpers (same scope)
#   - mypy          on Python helpers (same scope as ruff)
# Config lives in .shellcheckrc and pyproject.toml at repo root.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        # -x follows `source` / `.` so library files in vm-setup/lib are
        # checked in the context of the script that includes them.
        # -S warning fails the job on warnings and errors but ignores
        # info-level style nits.
        # vm-setup/third-party/ is vendored upstream code; lab/ holds
        # per-CVE PoC scratch and is excluded by policy.
        # Use -print0 | xargs -0 (no `mapfile`) so the same one-liner
        # in CONTRIBUTING.md works on bash 3.2 (macOS) and zsh too.
        run: |
          find . -name '*.sh' \
            -not -path './vm-setup/third-party/*' \
            -not -path './lab/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 shellcheck -x -S warning

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install --no-cache-dir 'ruff==0.15.*'

      - name: ruff check
        # Config (target-version, line-length, rule selection, per-file
        # ignores) lives in pyproject.toml at the repo root.
        run: ruff check

      - name: ruff format --check
        # Same config; [tool.ruff.format] in pyproject.toml. --check
        # fails CI if any in-scope Python file isn't formatter-clean.
        run: ruff format --check

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shfmt
        # mvdan/sh's official binary release. Pin a specific version so a
        # silent upstream formatting change can't fail CI on a green
        # branch.
        run: |
          set -e
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x /usr/local/bin/shfmt
          shfmt --version

      - name: shfmt --diff
        # Flags must match the documented local invocation in
        # CONTRIBUTING.md and CLAUDE.md exactly:
        #   -i 4  : 4-space indent (the dominant existing style)
        #   -ci   : indent switch-case arms one level (matches existing)
        # -d / --diff exits non-zero with a unified diff if anything is
        # out of format. vm-setup/third-party/ is vendored upstream code
        # and lab/ holds per-CVE scratch; both are excluded by policy.
        run: |
          find . -name '*.sh' \
            -not -path './vm-setup/third-party/*' \
            -not -path './lab/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 shfmt -i 4 -ci -d

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match [tool.mypy] python_version in pyproject.toml. The gold
          # image's bundled Python is the floor we need to support; CI
          # type-checks against that floor so we don't ship a syntax or
          # typing construct the guest can't parse.
          python-version: "3.10"

      - name: Install mypy
        run: pip install --no-cache-dir 'mypy==1.20.*'

      - name: mypy
        # Scope (files, exclude), python_version, and the strict-ish flag
        # set all live under [tool.mypy] in pyproject.toml.
        run: mypy
