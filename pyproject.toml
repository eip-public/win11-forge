# Repo-level Python tooling config.
#
# Scope: the host/guest helper scripts that ship as part of win11-forge
# itself — `vm-setup/*.py` and `vm-setup/lib/*.py`. These are the agent-
# and operator-facing entry points (kd_wrapper, target_mcp_http,
# windbg_mcp_http, qga, vmrun, set-disk-source).
#
# Out of scope (excluded below):
#   - vm-setup/third-party/    vendored upstream forks; lint them upstream
#   - lab/                     per-CVE PoCs; intentionally rough scratch code
#   - **/__pycache__/          generated
#
# The gold image ships system Python 3.x (3.10+ on 24H2). Target the
# oldest version we still expect to run on so we don't accidentally
# introduce 3.12-only syntax that breaks a guest. Bump as the gold
# image's bundled Python moves forward.

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = [
    "vm-setup/third-party",
    "lab",
    "**/__pycache__",
]

[tool.ruff.lint]
# Curated rule sets:
#   E,W  pycodestyle errors/warnings (excluding line-length nits)
#   F    pyflakes (unused imports, undefined names, etc.)
#   I    isort import ordering
#   B    flake8-bugbear (likely bugs)
#   UP   pyupgrade (modern Python idioms)
#   SIM  flake8-simplify (collapsible conditionals)
#   RUF  ruff-specific rules
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # We use `except Exception:` deliberately around cleanup paths (kd.exe
    # supervisor, MCP shim) where any exception means "drop this resource
    # and move on". Narrowing here would obscure intent.
    "BLE001",
    # subprocess with shell=False but partial-path executable — the
    # guest scripts intentionally hard-code Windows paths (kd.exe,
    # node.exe) and adding shell=True would be worse.
    "S603", "S607",
    # f-string in logging — readable and the perf cost is irrelevant
    # for the volumes these scripts log at.
    "G004",
    # try/except/pass for cleanup is more readable than
    # contextlib.suppress in tight cleanup blocks (kd.exe shutdown,
    # log handle flush). The intent is "best-effort close, never raise".
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# kd_wrapper.py is a long-lived SYSTEM supervisor that intentionally
# holds file handles open across the supervisor loop iterations
# (_kd_log_fh is a module global rotated by _start_kd). A `with`
# block would force a structural rewrite to no benefit, so SIM115
# (use a context manager) does not apply here.
"vm-setup/kd_wrapper.py" = ["SIM115"]
# vmrun.py / qga.py are thin CLI wrappers around host binaries; their
# `_cli` dispatchers legitimately use sys.exit at many call sites.
"vm-setup/lib/vmrun.py" = ["B008"]
"vm-setup/lib/qga.py" = ["B008"]

# ── Code formatter ────────────────────────────────────────────────
# `ruff format` is the canonical Python formatter for this repo
# (Black-compatible output, but pulled from the same ruff binary that
# runs the linter). Scope and target-version are inherited from
# [tool.ruff] above. Run locally with:
#   ruff format            # write changes
#   ruff format --check    # CI-style verify
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false

# ── Static type checking ──────────────────────────────────────────
# Scope mirrors [tool.ruff] above: the host/guest helper scripts
# under `vm-setup/`. Run locally with:
#   /path/to/venv/bin/mypy vm-setup
# Also runs in CI on every push and PR (.github/workflows/lint.yml).
[tool.mypy]
python_version = "3.10"
files = ["vm-setup"]
exclude = '(^|/)(vm-setup/third-party/|vm-setup/setup-vm-phases/|__pycache__/)'

# Strict-ish defaults: catch the high-value bugs (any/missing
# return/unused ignores) without forcing fully-typed every-argument
# style on helper scripts that are mostly CLI glue and subprocess
# orchestration. Bump these together (e.g. add disallow_untyped_defs)
# as the Python surface grows.
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
extra_checks = true

# Third-party packages used by the guest-side MCP shims aren't
# installed in CI (fastmcp pulls in a large transitive tree and is
# only ever imported inside the Windows gold image). Silence the
# import-not-found error for the few external modules — the surface
# we care about is our own code.
[[tool.mypy.overrides]]
module = [
    # `fastmcp`, `config`, `core.*`, `tools` live inside the cloned
    # NadavLor/windbg-ext-mcp checkout staged under C:\winforge\ on the
    # gold image (see vm-setup/windbg_mcp_http.py:HERE / mcp_server).
    # They are not pip-installable, so CI can't see them.
    "fastmcp",
    "fastmcp.*",
    "config",
    "core.*",
    "tools",
    "tools.*",
]
ignore_missing_imports = true
